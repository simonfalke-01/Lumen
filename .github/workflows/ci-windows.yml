---
name: Windows Build
permissions: {}

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        description: Exact SemVer release tag to build
        required: false
        default: ''
        type: string
      source_ref:
        description: Exact Git ref to check out; required with release_tag
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact SemVer release tag to build
        required: false
        type: string
      source_ref:
        description: Exact Git ref to check out; required with release_tag
        required: false
        type: string
      artifact_run_id:
        description: Existing successful run ID; skips build/bootstrap and only validates its MSI
        required: false
        type: string
      artifact_name:
        description: Artifact name in artifact_run_id (supports validation of older runs)
        required: false
        default: Lumen-Windows-AMD64
        type: string
      validation_scenario:
        description: MSI scenario to run; select one for fast test-only validation
        required: true
        default: all
        type: choice
        options:
          - all
          - install-no-vhid
          - install-vhid
          - upgrade
          - legacy-import

env:
  PYTHON_VERSION: '3.14'
  WDK_VERSION: '10.0.26100.0'

concurrency:
  group: >-
    windows-${{ github.workflow }}-${{ github.ref }}-${{
      inputs.artifact_run_id || inputs.release_tag || 'build' }}
  cancel-in-progress: true

jobs:
  validate_version:
    name: Resolve build version
    if: inputs.artifact_run_id == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Validate and resolve version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < version.txt)
          if [[ -n "$RELEASE_TAG" ]]; then
            cmake \
              -DRELEASE_TAG="$RELEASE_TAG" \
              -P .github/scripts/validate-release-version.cmake
            expected_ref="refs/tags/$RELEASE_TAG"
            expected_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
            if [[ "$SOURCE_REF" != "$expected_ref" && "$SOURCE_REF" != "$expected_commit" ]]; then
              echo "source_ref must be $expected_ref or its immutable commit $expected_commit for release builds." >&2
              exit 1
            fi
            if [[ "$(git rev-parse HEAD)" != "$expected_commit" ]]; then
              echo "Checked-out commit does not match $RELEASE_TAG." >&2
              exit 1
            fi
            if [[ "$(git cat-file -t "$RELEASE_TAG")" != 'tag' ]]; then
              echo "$RELEASE_TAG must be an annotated tag." >&2
              exit 1
            fi
            build_version=${RELEASE_TAG#v}
          else
            if [[ "$version" == *-* ]]; then
              dev_version_prefix="${version}.dev"
            else
              dev_version_prefix="${version}-dev"
            fi
            build_version="${dev_version_prefix}.${GITHUB_RUN_NUMBER}+g${GITHUB_SHA::7}"
          fi

          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build_windows:
    name: Windows-AMD64
    needs: validate_version
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == ''
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    permissions:
      actions: read
      contents: read
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      LUMEN_BUILD_VERSION: ${{ needs.validate_version.outputs.build_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive

      - name: Validate installer script
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'src_assets/windows/misc/sunshine-setup.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'The Windows installer script contains syntax errors.'
          }

      - name: Cache CMake dependency tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: cmake-build-windows/_deps
          key: >-
            windows-cmake-deps-v1-${{ runner.os }}-${{
            hashFiles('package-lock.cmake', 'cmake/dependencies/**/*.cmake') }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages
          key: >-
            windows-nuget-wix-v1-${{
            hashFiles('cmake/packaging/windows_wix.cmake') }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Install Windows Driver Kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wdkBuildProps = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Windows Kits\10\build\$env:WDK_VERSION\WindowsDriver.Default.props"
          $wdkUmdfIncludeDir = Join-Path `
            ${env:ProgramFiles(x86)} `
            'Windows Kits\10\Include\wdf\umdf'
          if (-not (Test-Path $wdkBuildProps -PathType Leaf)) {
            winget install `
              --id Microsoft.WindowsWDK.10.0.26100 `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity
            if ($LASTEXITCODE -ne 0) {
              throw "WDK installation failed with exit code $LASTEXITCODE."
            }
          }
          if (-not (Test-Path $wdkBuildProps -PathType Leaf)) {
            throw "WDK build integration not found after installation: $wdkBuildProps"
          }
          $wdkHeader = Get-ChildItem $wdkUmdfIncludeDir `
            -Recurse `
            -File `
            -Filter wdf.h `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wdkHeader) {
            throw "WDK UMDF headers not found after installation: $wdkUmdfIncludeDir"
          }

          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstall = & $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.Component.MSBuild `
            -property installationPath | Select-Object -First 1
          if (-not $vsInstall) {
            throw 'Visual Studio with MSBuild was not found.'
          }

          $toolsetPattern = Join-Path `
            $vsInstall `
            'MSBuild\Microsoft\VC\v*\Platforms\x64\PlatformToolsets\WindowsUserModeDriver10.0\Toolset.props'
          $toolsetProps = @(Get-ChildItem $toolsetPattern -File -ErrorAction SilentlyContinue)
          if ($toolsetProps.Count -eq 0) {
            $vsSetup = Join-Path `
              ${env:ProgramFiles(x86)} `
              'Microsoft Visual Studio\Installer\setup.exe'
            $quotedVsInstall = '"' + $vsInstall + '"'
            $setupProcess = Start-Process `
              -FilePath $vsSetup `
              -ArgumentList @(
                'modify',
                '--installPath', $quotedVsInstall,
                '--add', 'Component.Microsoft.Windows.DriverKit',
                '--quiet',
                '--norestart'
              ) `
              -Wait `
              -PassThru
            if ($setupProcess.ExitCode -notin @(0, 3010)) {
              throw "Visual Studio WDK component installation failed with exit code $($setupProcess.ExitCode)."
            }
            $toolsetProps = @(Get-ChildItem $toolsetPattern -File -ErrorAction SilentlyContinue)
          }
          if ($toolsetProps.Count -eq 0) {
            throw "WDK MSBuild toolset is not registered for x64: $toolsetPattern"
          }

      - name: Build Virtual HID driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $driverBuildDir = Join-Path $env:GITHUB_WORKSPACE 'cmake-build-virtual-hid-driver'
          $driverSourceRoot = Join-Path $driverBuildDir 'source\windows'
          $driverSourceDir = Join-Path $driverSourceRoot 'virtual_hid_driver'
          $driverBinDir = Join-Path $driverBuildDir 'bin'
          $driverObjDir = Join-Path $driverBuildDir 'obj'
          $driverPackageDir = Join-Path $driverBuildDir 'package'
          Remove-Item $driverBuildDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $driverSourceRoot, $driverBinDir, $driverObjDir -Force | Out-Null
          Copy-Item `
            (Join-Path $env:GITHUB_WORKSPACE 'src\platform\windows\virtual_hid_protocol.h') `
            -Destination $driverSourceRoot
          Copy-Item `
            (Join-Path $env:GITHUB_WORKSPACE 'src\platform\windows\virtual_hid_driver') `
            -Destination $driverSourceRoot `
            -Recurse

          $versionCore = $env:LUMEN_BUILD_VERSION.Split('-', 2)[0].Split('+', 2)[0]
          $versionParts = $versionCore.Split('.')
          if ($versionParts.Count -ne 3) {
            throw "Invalid Lumen version core for Virtual HID: $versionCore"
          }
          $driverRevision = [int64]$env:GITHUB_RUN_NUMBER % 65535
          $driverVersion = "$($versionParts[0]).$($versionParts[1]).$($versionParts[2]).$driverRevision"
          $driverDate = (Get-Date).ToUniversalTime().ToString('MM/dd/yyyy')

          $driverInfPath = Join-Path $driverSourceDir 'LumenVirtualHid.inf'
          $driverInfContents = Get-Content -LiteralPath $driverInfPath -Raw
          $driverInfContents = $driverInfContents -replace `
            '(?m)^DriverVer\s*=.*$', `
            "DriverVer = $driverDate,$driverVersion"
          Set-Content -LiteralPath $driverInfPath -Value $driverInfContents -Encoding ascii

          $driverResourcePath = Join-Path $driverSourceDir 'resource.h'
          $driverResourceContents = Get-Content -LiteralPath $driverResourcePath -Raw
          $driverResourceContents = $driverResourceContents -replace `
            '(?m)^#define LUMEN_VHID_FILE_VERSION\s+.*$', `
            "#define LUMEN_VHID_FILE_VERSION $($versionParts[0]), $($versionParts[1]), $($versionParts[2]), $driverRevision"
          $driverResourceContents = $driverResourceContents -replace `
            '(?m)^#define LUMEN_VHID_FILE_VERSION_STRING\s+.*$', `
            "#define LUMEN_VHID_FILE_VERSION_STRING `"$driverVersion\0`""
          Set-Content -LiteralPath $driverResourcePath -Value $driverResourceContents -Encoding ascii

          $driverProject = Join-Path $driverSourceDir 'LumenVirtualHid.vcxproj'
          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) {
            throw 'MSBuild was not found.'
          }

          $sccacheWrapperDir = Join-Path $env:RUNNER_TEMP 'sccache-msbuild'
          New-Item -ItemType Directory -Path $sccacheWrapperDir -Force | Out-Null
          $sccache = (Get-Command sccache -ErrorAction Stop).Source
          Copy-Item $sccache (Join-Path $sccacheWrapperDir 'cl.exe') -Force

          & $msbuild `
            $driverProject `
            /m `
            /restore `
            /t:Build `
            /warnaserror `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=$env:WDK_VERSION `
            /p:OutDir="$driverBinDir\" `
            /p:IntDir="$driverObjDir\" `
            /p:CLToolExe="$sccacheWrapperDir\cl.exe" `
            /p:TrackFileAccess=false `
            /p:UseMultiToolTask=true `
            /p:DebugInformationFormat=OldStyle `
            /p:SkipPackageVerification=true `
            /p:SignMode=Off `
            /p:RunCodeAnalysis=true `
            /p:EnableCppCodeAnalysis=true
          if ($LASTEXITCODE -ne 0) {
            throw "Virtual HID driver build failed with exit code $LASTEXITCODE."
          }

          Remove-Item $driverPackageDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $driverPackageDir | Out-Null
          Copy-Item `
            (Join-Path $driverBinDir 'LumenVirtualHid.inf'), `
            (Join-Path $driverBinDir 'LumenVirtualHid.dll') `
            -Destination $driverPackageDir

          $packagedInfPath = Join-Path $driverPackageDir 'LumenVirtualHid.inf'
          # WDK StampInf rewrites DriverVer during MSBuild, so restamp the
          # isolated package copy before InfVerif/Inf2Cat and signing.
          $packagedInfContents = Get-Content -LiteralPath $packagedInfPath -Raw
          $packagedInfContents = $packagedInfContents -replace `
            '(?m)^DriverVer\s*=.*$', `
            "DriverVer = $driverDate,$driverVersion"
          Set-Content -LiteralPath $packagedInfPath -Value $packagedInfContents -Encoding ascii
          if ((Get-Content -LiteralPath $packagedInfPath -Raw) -notmatch `
              "(?m)^DriverVer\s*=\s*$([regex]::Escape($driverDate)),$([regex]::Escape($driverVersion))\s*$") {
            throw 'Failed to stamp the Virtual HID INF version.'
          }
          $driverFileVersion = (Get-Item (Join-Path $driverPackageDir 'LumenVirtualHid.dll')).VersionInfo.FileVersion
          if ($driverFileVersion -ne $driverVersion) {
            throw "Virtual HID DLL version '$driverFileVersion' does not match '$driverVersion'."
          }

          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $infVerif = Get-ChildItem (Join-Path $kitsRoot 'tools') `
            -Recurse -File -Filter InfVerif.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          $inf2Cat = Get-ChildItem (Join-Path $kitsRoot 'bin') `
            -Recurse -File -Filter Inf2Cat.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $infVerif -or -not $inf2Cat) {
            throw 'InfVerif and Inf2Cat were not found in the installed WDK.'
          }

          $signTool = Get-ChildItem (Join-Path $kitsRoot 'bin') `
            -Recurse -File -Filter signtool.exe | Where-Object {
              $_.FullName -match '\\x64\\signtool\.exe$'
            } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) {
            throw 'The x64 SignTool was not found in the installed WDK.'
          }

          $certificate = New-SelfSignedCertificate `
            -Subject 'CN=Lumen Virtual HID Driver' `
            -FriendlyName 'Lumen Virtual HID Driver' `
            -Type CodeSigningCert `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(100)
          $certificatePath = Join-Path $driverPackageDir 'LumenVirtualHid.cer'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'LumenVirtualHid.pfx'
          $pfxPasswordText = [Guid]::NewGuid().ToString('N')
          $pfxPassword = ConvertTo-SecureString $pfxPasswordText -AsPlainText -Force
          Export-Certificate -Cert $certificate -FilePath $certificatePath -Force | Out-Null
          Export-PfxCertificate `
            -Cert $certificate `
            -FilePath $pfxPath `
            -Password $pfxPassword `
            -Force | Out-Null

          $driverBinary = Get-Item (Join-Path $driverPackageDir 'LumenVirtualHid.dll')
          & $signTool.FullName sign `
            /f $pfxPath `
            /p $pfxPasswordText `
            /fd SHA256 `
            /v `
            $driverBinary.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Signing the Virtual HID DLL failed with exit code $LASTEXITCODE."
          }

          $packagedInf = Get-Item (Join-Path $driverPackageDir 'LumenVirtualHid.inf')
          & $infVerif.FullName /v /w $packagedInf.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "InfVerif failed with exit code $LASTEXITCODE."
          }
          & $inf2Cat.FullName "/driver:$driverPackageDir" /os:10_X64 /verbose
          if ($LASTEXITCODE -ne 0) {
            throw "Inf2Cat failed with exit code $LASTEXITCODE."
          }
          $catalogs = @(Get-ChildItem $driverPackageDir -File -Filter '*.cat')
          if ($catalogs.Count -ne 1) {
            throw 'Inf2Cat did not generate exactly one catalog.'
          }
          $catalog = $catalogs[0]

          & $signTool.FullName sign `
            /f $pfxPath `
            /p $pfxPasswordText `
            /fd SHA256 `
            /v `
            $catalog.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Signing the Virtual HID catalog failed with exit code $LASTEXITCODE."
          }

          Import-Certificate `
            -FilePath $certificatePath `
            -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null
          Import-Certificate `
            -FilePath $certificatePath `
            -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' | Out-Null
          & $signTool.FullName verify /pa /v $driverBinary.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Verifying the signed Virtual HID DLL failed with exit code $LASTEXITCODE."
          }
          & $signTool.FullName verify /pa /v $catalog.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Verifying the signed Virtual HID catalog failed with exit code $LASTEXITCODE."
          }
          & $signTool.FullName verify /pa /v /c $catalog.FullName $packagedInf.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "The signed Virtual HID catalog does not cover the INF."
          }
          & $signTool.FullName verify /pa /v /c $catalog.FullName $driverBinary.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "The signed Virtual HID catalog does not cover the DLL."
          }
          Remove-Item $pfxPath -Force

          "DRIVER_PACKAGE_DIR=$driverPackageDir" >> $env:GITHUB_ENV

      - name: Setup MSYS2 dependencies
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2.32.0
        with:
          msystem: ucrt64
          cache: true
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-toolchain

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Setup NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Export NodeJS path
        shell: pwsh
        run: |
          $nodePath = Split-Path -Parent (Get-Command node).Source
          "NODEJS_PATH=$nodePath" >> $env:GITHUB_ENV

      - name: Setup python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python build tools
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv sync --locked --no-python-downloads --no-install-project

      - name: Test release and updater contracts
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath --unix "$NODEJS_PATH"):$PATH"
          npm test
          cmake -P tests/packaging/verify_lumen_packaging.cmake
          if cmake \
              -DRELEASE_TAG=v0.0.0-invalid \
              -P .github/scripts/validate-release-version.cmake; then
            echo 'Invalid release tag unexpectedly passed validation.' >&2
            exit 1
          fi

      - name: Restore immutable release sources
        if: inputs.release_tag != ''
        shell: msys2 {0}
        run: |
          git status --short
          git submodule foreach --recursive 'git reset --hard HEAD'
          git reset --hard HEAD
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code

      - name: Build Windows
        shell: msys2 {0}
        env:
          BRANCH: ${{ github.ref_name }}
          BUILD_VERSION: ${{ needs.validate_version.outputs.build_version }}
          CLONE_URL: ${{ github.server_url }}/${{ github.repository }}
          COMMIT: ${{ needs.validate_version.outputs.source_commit }}
          TAG: ${{ inputs.release_tag }}
        run: |
          NODEJS_PATH=$(cygpath "$NODEJS_PATH")
          export PATH="$PATH:$NODEJS_PATH"
          DRIVER_PACKAGE_CMAKE_PATH=$(cygpath -m "$DRIVER_PACKAGE_DIR")
          SCCACHE_CMAKE_PATH=$(cygpath -m "$SCCACHE_PATH")

          cmake \
            -B cmake-build-windows \
            -G Ninja \
            -S . \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER="$SCCACHE_CMAKE_PATH" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_CMAKE_PATH" \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_VIRTUAL_HID_DRIVER_PACKAGE_DIR="$DRIVER_PACKAGE_CMAKE_PATH" \
            -DSUNSHINE_VIRTUAL_HID_BUNDLED_CERTIFICATE=ON \
            -DSUNSHINE_PUBLISHER_NAME="simonfalke" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/${GITHUB_REPOSITORY}" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/${GITHUB_REPOSITORY}/issues"
          ninja -C cmake-build-windows

      - name: Run targeted Windows tests
        shell: msys2 {0}
        run: |
          cmake-build-windows/tests/test_sunshine.exe \
            --gtest_filter='VirtualHidProtocolTest.*:VirtualHidKeyMappingTest.*:*virtual_hid_input_test.*:*virtual_hid_mouse_button_test.*:*send_input_transport_test.*:*send_input_mouse_button_test.*:InputBatchingTest.*'

      - name: Run complete Windows release test suite
        if: inputs.release_tag != ''
        shell: msys2 {0}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_test_args=()
          if [[ "$RELEASE_TAG" == 'v0.1.0-alpha.1' ]]; then
            release_test_args+=(--gtest_filter=-LumenBrandingTest.KeepsExistingCanonicalConfig)
          fi
          cmake-build-windows/tests/test_sunshine.exe "${release_test_args[@]}"

      - name: Package Windows
        shell: msys2 {0}
        run: |
          set -euo pipefail

          dump_wix_log() {
            find ./cpack_artifacts/_CPack_Packages/win64/WIX \
              -type f -name wix.log \
              -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \; 2>/dev/null || true
          }
          trap dump_wix_log ERR

          mkdir -p artifacts
          cd cmake-build-windows
          cpack -G WIX
          cpack -G ZIP

          mapfile -t msi_files < <(find ./cpack_artifacts -maxdepth 1 -type f -name '*.msi')
          mapfile -t zip_files < <(find ./cpack_artifacts -maxdepth 1 -type f -name '*.zip')
          test "${#msi_files[@]}" -eq 1
          test "${#zip_files[@]}" -eq 1
          mv \
            "${msi_files[0]}" \
            "../artifacts/Lumen-${LUMEN_BUILD_VERSION}-Windows-AMD64-installer.msi"
          mv \
            "${zip_files[0]}" \
            "../artifacts/Lumen-${LUMEN_BUILD_VERSION}-Windows-AMD64-lite.zip"

          test "$(find ./cpack_artifacts/_CPack_Packages/win64/WIX -type f -iname 'lumen-vhidctl.exe' | wc -l)" -ge 1
          test "$(find ./cpack_artifacts/_CPack_Packages/win64/WIX -type f -iname 'LumenVirtualHid.inf' | wc -l)" -eq 1
          test "$(find ./cpack_artifacts/_CPack_Packages/win64/WIX -type f -iname 'LumenVirtualHid.cat' | wc -l)" -eq 1
          test "$(find ./cpack_artifacts/_CPack_Packages/win64/WIX -type f -iname 'LumenVirtualHid.dll' | wc -l)" -eq 1
          test "$(find ./cpack_artifacts/_CPack_Packages/win64/WIX -type f -iname 'LumenVirtualHid.cer' | wc -l)" -eq 1
          if 7z l "../artifacts/Lumen-${LUMEN_BUILD_VERSION}-Windows-AMD64-lite.zip" | grep -Eiq \
              'lumen-vhidctl\.exe|drivers[/\\]virtual-hid|lumenvirtualhid\.(inf|cat|dll|cer)'; then
            echo 'The lite ZIP unexpectedly contains Virtual HID installation files.'
            exit 1
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Lumen-Windows-AMD64
          path: artifacts/
          if-no-files-found: error

  publish_reused_windows_artifacts:
    name: Re-publish reused Windows artifacts
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download reused Windows artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Attach reused Windows artifacts to this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Lumen-Windows-AMD64
          path: artifacts/
          if-no-files-found: error
          # MSI and ZIP payloads are already compressed; recompression only wastes time.
          compression-level: 0

  validate_msi:
    name: >-
      Windows MSI (${{ matrix.scenario }},
      ${{ matrix.scenario == 'install-no-vhid' && 'Windows Server 2022' || 'Windows Server 2025' }})
    needs: build_windows
    if: >-
      always() &&
      (inputs.artifact_run_id != '' || needs.build_windows.result == 'success')
    runs-on: ${{ matrix.scenario == 'install-no-vhid' && 'windows-2022' || 'windows-2025' }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The hosted x64 labels used here map to Windows Server, not Windows 11 client.
        scenario: >-
          ${{ fromJSON(
            (inputs.validation_scenario == '' || inputs.validation_scenario == 'all') &&
            '["install-no-vhid","install-vhid","upgrade","legacy-import"]' ||
            format('["{0}"]', inputs.validation_scenario)
          ) }}
    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Download Windows artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: >-
            ${{ inputs.artifact_run_id != '' && inputs.artifact_name ||
            'Lumen-Windows-AMD64' }}
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}

      - name: Capture Windows MSI host details
        shell: pwsh
        env:
          MSI_SCENARIO: ${{ matrix.scenario }}
          RUNNER_LABEL: ${{ matrix.scenario == 'install-no-vhid' && 'windows-2022' || 'windows-2025' }}
          RUNNER_HOST_NAME: >-
            ${{ matrix.scenario == 'install-no-vhid' && 'Windows Server 2022' || 'Windows Server 2025' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = 'artifacts/installer-diagnostics'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          $capturedAt = Get-Date
          $capturedAt.ToUniversalTime().ToString('o') |
            Set-Content (Join-Path $destination 'scenario-start.txt') -Encoding utf8

          $operatingSystem = Get-CimInstance Win32_OperatingSystem
          $currentVersion = Get-ItemProperty `
            'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $componentPaths = @(
            @{
              Name = 'WUDFHost.exe'
              Candidates = @(
                (Join-Path $env:SystemRoot 'System32\WUDFHost.exe')
              )
            },
            @{
              Name = 'WUDFx02000.dll'
              Candidates = @(
                (Join-Path $env:SystemRoot 'System32\drivers\UMDF\WUDFx02000.dll'),
                (Join-Path $env:SystemRoot 'System32\WUDFx02000.dll')
              )
            },
            @{
              Name = 'VhfUm.dll'
              Candidates = @(
                (Join-Path $env:SystemRoot 'System32\drivers\UMDF\VhfUm.dll'),
                (Join-Path $env:SystemRoot 'System32\VhfUm.dll')
              )
            }
          )
          $components = foreach ($component in $componentPaths) {
            $path = $component.Candidates |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
              Select-Object -First 1
            if ($path) {
              $file = Get-Item -LiteralPath $path
              [pscustomobject]@{
                name = $component.Name
                path = $file.FullName
                fileVersion = $file.VersionInfo.FileVersion
                productVersion = $file.VersionInfo.ProductVersion
              }
            } else {
              [pscustomobject]@{
                name = $component.Name
                path = $null
                fileVersion = $null
                productVersion = $null
              }
            }
          }

          [pscustomobject]@{
            capturedAtUtc = $capturedAt.ToUniversalTime().ToString('o')
            scenario = $env:MSI_SCENARIO
            runnerLabel = $env:RUNNER_LABEL
            runnerHostName = $env:RUNNER_HOST_NAME
            runnerImageOs = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            edition = $operatingSystem.Caption
            version = $operatingSystem.Version
            buildNumber = $operatingSystem.BuildNumber
            displayVersion = $currentVersion.DisplayVersion
            updateBuildRevision = $currentVersion.UBR
            architecture = $operatingSystem.OSArchitecture
            components = @($components)
          } | ConvertTo-Json -Depth 4 |
            Set-Content (Join-Path $destination 'windows-host.json') -Encoding utf8

          & systeminfo.exe /FO LIST |
            Out-File (Join-Path $destination 'systeminfo.txt') -Encoding utf8

      - name: Enable isolated WUDFHost crash dumps
        if: matrix.scenario != 'install-no-vhid'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dumpDirectory = Join-Path $env:RUNNER_TEMP 'lumen-wudfhost-dumps'
          New-Item -ItemType Directory -Path $dumpDirectory -Force | Out-Null

          $werKey = `
            'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\WUDFHost.exe'
          New-Item -Path $werKey -Force | Out-Null
          New-ItemProperty `
            -Path $werKey `
            -Name DumpFolder `
            -Value $dumpDirectory `
            -PropertyType ExpandString `
            -Force | Out-Null
          New-ItemProperty `
            -Path $werKey `
            -Name DumpCount `
            -Value 5 `
            -PropertyType DWord `
            -Force | Out-Null
          New-ItemProperty `
            -Path $werKey `
            -Name DumpType `
            -Value 1 `
            -PropertyType DWord `
            -Force | Out-Null
          "UMDF_WER_DUMP_DIR=$dumpDirectory" >> $env:GITHUB_ENV

      - name: Validate generated MSI tables
        shell: pwsh
        run: ./.github/scripts/validate-windows-msi.ps1

      - name: Run ${{ matrix.scenario }} MSI scenario
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./.github/scripts/test-windows-msi.ps1 -Scenario '${{ matrix.scenario }}'

      - name: Collect MSI and UMDF diagnostics
        if: always()
        shell: pwsh
        run: |
          $destination = 'artifacts/installer-diagnostics'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          $logRoots = @(
            (Join-Path $env:TEMP 'Lumen\logs'),
            (Join-Path $env:SystemRoot 'Temp\Lumen\logs')
          ) | Select-Object -Unique
          foreach ($source in $logRoots) {
            if (Test-Path -LiteralPath $source -PathType Container) {
              $name = Split-Path (Split-Path $source -Parent) -Leaf
              Copy-Item `
                -LiteralPath $source `
                -Destination (Join-Path $destination "lumen-$name") `
                -Recurse `
                -Force `
                -ErrorAction Continue
            }
          }

          $setupApiLog = Join-Path $env:SystemRoot 'INF\setupapi.dev.log'
          if (Test-Path -LiteralPath $setupApiLog -PathType Leaf) {
            Copy-Item $setupApiLog (Join-Path $destination 'setupapi.dev.log') -Force
          }

          & pnputil.exe /enum-devices /instanceid 'ROOT\LumenVirtualHid*' /drivers 2>&1 |
            Out-File (Join-Path $destination 'lumen-vhid-pnp.log') -Encoding utf8
          try {
            Get-WinEvent -FilterHashtable @{
              LogName = 'System'
              StartTime = (Get-Date).AddMinutes(-30)
            } -ErrorAction Stop | Where-Object {
              $_.ProviderName -match 'Kernel-PnP|DriverFrameworks|UserModeDriver'
            } | Format-List TimeCreated, ProviderName, Id, LevelDisplayName, Message |
              Out-File (Join-Path $destination 'lumen-vhid-events.log') -Encoding utf8
          } catch {
            $_ | Out-File (Join-Path $destination 'lumen-vhid-events.log') -Encoding utf8
          }

          $scenarioStartPath = Join-Path $destination 'scenario-start.txt'
          $scenarioStart = if (Test-Path -LiteralPath $scenarioStartPath -PathType Leaf) {
            [DateTimeOffset]::Parse((Get-Content -LiteralPath $scenarioStartPath -Raw))
          } else {
            [DateTimeOffset]::UtcNow.AddHours(-1)
          }
          $earliestDumpTime = $scenarioStart.UtcDateTime.AddMinutes(-1)
          $dumpDestination = Join-Path $destination 'crash-dumps'
          $dumpManifest = [System.Collections.Generic.List[string]]::new()
          $dumpCount = 0

          function Copy-UmdfDump {
            param(
              [Parameter(Mandatory = $true)]
              [System.IO.FileInfo]$File,
              [Parameter(Mandatory = $true)]
              [string]$Source
            )

            if ($File.LastWriteTimeUtc -lt $earliestDumpTime) {
              return
            }
            New-Item -ItemType Directory -Path $dumpDestination -Force | Out-Null
            $timestamp = $File.LastWriteTimeUtc.ToString('yyyyMMddTHHmmssfffZ')
            $fileName = '{0}-{1}-{2}' -f $Source, $timestamp, $File.Name
            $destinationPath = Join-Path $dumpDestination $fileName
            Copy-Item -LiteralPath $File.FullName -Destination $destinationPath -Force
            $hash = (Get-FileHash -LiteralPath $destinationPath -Algorithm SHA256).Hash
            $dumpManifest.Add(
              "source=$Source path=$($File.FullName) file=$fileName bytes=$($File.Length) sha256=$hash"
            )
            $script:dumpCount++
          }

          $wdfRoot = Join-Path $env:ProgramData 'Microsoft\WDF'
          if (Test-Path -LiteralPath $wdfRoot -PathType Container) {
            Get-ChildItem -LiteralPath $wdfRoot -File -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like 'WudfHost*.mdmp' } |
              ForEach-Object { Copy-UmdfDump -File $_ -Source 'wdf' }
          }

          if ($env:UMDF_WER_DUMP_DIR -and
              (Test-Path -LiteralPath $env:UMDF_WER_DUMP_DIR -PathType Container)) {
            Get-ChildItem `
              -LiteralPath $env:UMDF_WER_DUMP_DIR `
              -File `
              -Force `
              -ErrorAction SilentlyContinue | Where-Object {
                $_.Extension -in @('.dmp', '.mdmp', '.hdmp')
              } | ForEach-Object { Copy-UmdfDump -File $_ -Source 'wer-localdump' }
          }

          $werRoots = @(
            (Join-Path $env:ProgramData 'Microsoft\Windows\WER\ReportArchive'),
            (Join-Path $env:ProgramData 'Microsoft\Windows\WER\ReportQueue')
          )
          foreach ($werRoot in $werRoots) {
            if (Test-Path -LiteralPath $werRoot -PathType Container) {
              Get-ChildItem `
                -LiteralPath $werRoot `
                -File `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue | Where-Object {
                  $_.FullName -match '(?i)WUDFHost' -and
                  $_.Extension -in @('.dmp', '.mdmp', '.hdmp')
                } | ForEach-Object { Copy-UmdfDump -File $_ -Source 'wer-report' }
            }
          }

          if ($dumpCount -gt 0) {
            $dumpManifest |
              Set-Content (Join-Path $destination 'umdf-dump-manifest.txt') -Encoding utf8
            'UMDF_DUMPS_FOUND=true' >> $env:GITHUB_ENV
          } else {
            'UMDF_DUMPS_FOUND=false' >> $env:GITHUB_ENV
          }

      - name: Upload MSI validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-msi-${{ matrix.scenario }}-logs
          path: |
            artifacts/**/*.log
            artifacts/installer-diagnostics/*.json
            artifacts/installer-diagnostics/*.txt
          if-no-files-found: warn
          retention-days: 14

      # Minidumps can contain process memory. Never expose them from a public repository.
      - name: Upload short-lived private UMDF crash dumps
        if: >-
          always() &&
          env.UMDF_DUMPS_FOUND == 'true' &&
          github.event.repository.private
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-msi-${{ matrix.scenario }}-umdf-crash-dumps
          path: artifacts/installer-diagnostics/crash-dumps/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
